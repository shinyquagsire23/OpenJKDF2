name: Rejected backpack count flags regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/Dss/sithDSSThing.c
      - src/types.h
      - src/types_win_enums.h
      - src/Primitives/rdRect.h
      - src/types_enums.h
      - src/engine_config.h
      - src/Tests/backpack_test.c
      - src/Tests/run_backpack_test.py
      - src/Tests/source_test_utils.py
      - .github/workflows/backpack-bounds.yml
      - docs/backpack-bounds.md
  push:
    branches: [master]
    paths:
      - src/Dss/sithDSSThing.c
      - src/types.h
      - src/types_win_enums.h
      - src/Primitives/rdRect.h
      - src/types_enums.h
      - src/engine_config.h
      - src/Tests/backpack_test.c
      - src/Tests/run_backpack_test.py
      - src/Tests/source_test_utils.py
      - .github/workflows/backpack-bounds.yml
      - docs/backpack-bounds.md

permissions:
  contents: read

concurrency:
  group: backpack-bounds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backpack-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run focused native regression
        run: python3 -B src/Tests/run_backpack_test.py --cc gcc --ubsan --negative-controls
