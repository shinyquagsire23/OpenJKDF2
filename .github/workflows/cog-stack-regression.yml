name: COG stack regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cog-stack-regression.yml
      - src/Cog/**
      - src/types.h
      - src/types_enums.h
      - src/engine_config.h
      - src/stdPlatform.c
      - src/stdPlatform.h
      - src/Tests/cog_stack_test.c
      - src/Tests/run_cog_stack_test.py
  push:
    branches: [master]
    paths:
      - .github/workflows/cog-stack-regression.yml
      - src/Cog/**
      - src/types.h
      - src/types_enums.h
      - src/engine_config.h
      - src/stdPlatform.c
      - src/stdPlatform.h
      - src/Tests/cog_stack_test.c
      - src/Tests/run_cog_stack_test.py

permissions:
  contents: read

concurrency:
  group: cog-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cog-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test bounded stack operations across symbol representations
        run: python3 -B src/Tests/run_cog_stack_test.py --cc gcc --sanitize
