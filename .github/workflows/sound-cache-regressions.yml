name: Stable sound cache regressions

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: sound-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sound-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test sound storage and ownership
        run: python3 -B src/Tests/run_sound_cache_test.py --output "$RUNNER_TEMP/sound-cache"
