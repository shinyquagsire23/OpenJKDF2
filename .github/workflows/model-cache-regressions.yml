name: Stable model cache regressions

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - src/World/sithModel.c
      - src/World/sithModel.h
      - src/Devices/sithSound.c
      - src/Devices/sithSound.h
      - src/World/sithWorld.c
      - src/Cog/sithCogExec.c
      - src/types.h
      - src/engine_config.h
      - src/Tests/model_cache_test.c
      - src/Tests/run_model_cache_test.py
      - .github/workflows/model-cache-regressions.yml
      - docs/MODEL_CACHE_GROWTH.md
  push:
    branches: [master]
    paths:
      - src/World/sithModel.c
      - src/World/sithModel.h
      - src/Devices/sithSound.c
      - src/Devices/sithSound.h
      - src/World/sithWorld.c
      - src/Cog/sithCogExec.c
      - src/types.h
      - src/engine_config.h
      - src/Tests/model_cache_test.c
      - src/Tests/run_model_cache_test.py
      - .github/workflows/model-cache-regressions.yml
      - docs/MODEL_CACHE_GROWTH.md

permissions:
  contents: read

concurrency:
  group: model-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test model storage and ownership
        run: python3 -B src/Tests/run_model_cache_test.py --output "$RUNNER_TEMP/model-cache"
