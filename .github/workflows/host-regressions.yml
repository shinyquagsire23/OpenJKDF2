name: Pixel unpack regression

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/host-regressions.yml
      - src/Platform/GL/jkgm*
      - src/SDL2_helper.h
      - src/Tests/jkgm_pixel_unpack_gl_test.cpp
      - src/Tests/cmake/pixel-unpack/CMakeLists.txt
  push:
    branches: [master]
    paths:
      - .github/workflows/host-regressions.yml
      - src/Platform/GL/jkgm*
      - src/SDL2_helper.h
      - src/Tests/jkgm_pixel_unpack_gl_test.cpp
      - src/Tests/cmake/pixel-unpack/CMakeLists.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pixel-unpack:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libegl-dev libgl-dev libgl1-mesa-dri
      - name: Build and run the production upload regression
        run: |
          timeout --kill-after=5s 60s cmake -S src/Tests/cmake/pixel-unpack -B "$RUNNER_TEMP/pixel-unpack"
          timeout --kill-after=5s 120s cmake --build "$RUNNER_TEMP/pixel-unpack" --parallel 1
          ctest --test-dir "$RUNNER_TEMP/pixel-unpack" --output-on-failure -V
