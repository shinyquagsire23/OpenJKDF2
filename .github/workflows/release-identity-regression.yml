name: Release source identity regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-identity-regression.yml
      - cmake_modules/version.cmake
      - src/Tests/test_version_override.py
  push:
    branches: [master]
    paths:
      - .github/workflows/release-identity-regression.yml
      - cmake_modules/version.cmake
      - src/Tests/test_version_override.py

permissions:
  contents: read

concurrency:
  group: release-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise actual CMake version selection
        run: python3 -B src/Tests/test_version_override.py
