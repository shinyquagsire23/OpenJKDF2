name: COG VectorCross regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vectorcross-regression.yml
      - src/Cog/**
      - src/Primitives/rdVector.c
      - src/types_enums.h
      - src/Tests/*vectorcross*
      - src/Tests/VECTORCROSS_TEST.md
  push:
    branches: [master]
    paths:
      - .github/workflows/vectorcross-regression.yml
      - src/Cog/**
      - src/Primitives/rdVector.c
      - src/types_enums.h
      - src/Tests/*vectorcross*
      - src/Tests/VECTORCROSS_TEST.md

permissions:
  contents: read

concurrency:
  group: vectorcross-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vectorcross:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the production wrapper and stack helpers
        run: python3 -B src/Tests/run_vectorcross_test.py --cc gcc --ubsan
